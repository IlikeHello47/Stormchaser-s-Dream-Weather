modLoader="javafml"
loaderVersion="${loader_version_range}"

license="${mod_license}"
issueTrackerURL="https://github.com"

[[mods]]
modId="stormchasers_dream_weather"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com"
logoFile="logo.png"
authors="IlikeHello47"
description='''
A extremely complicated and performant mod that adds weather events like Hurricanes, Tornados and snowstorms in Minecraft.
'''

[[mixins]]
config="stormchasers_dream_weather.mixins.json"

# The [[accessTransformers]] block allows you to declare where your AT file is.
# If this block is omitted, a fallback attempt will be made to load an AT from META-INF/accesstransformer.cfg
#[[accessTransformers]]
#file="META-INF/accesstransformer.cfg"

[[dependencies.stormchasers_dream_weather]]
modId="neoforge"
type="required"
reason="Are you even trying at this point? YOU NEED THE MODLOADER TO LOAD THE MOD!"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.stormchasers_dream_weather]]
modId="minecraft"
type="required"
reason="It's the game, WHY ARE YOU TRYING TO LOAD THE MOD WITHOUT IT?"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.stormchasers_dream_weather]]
modId="sodium"
type="optional"
reason="Required for optimal stable performance"
versionRange="[0.8.13,)"
ordering="NONE"
side="CLIENT"

[[dependencies.stormchasers_dream_weather]]
modId="ferritecore"
type="optional"
reason="Optimizes the memory usage for weak computers."
versionRange="[7.0.3,)"
ordering="NONE"
side="BOTH"

[[dependencies.stormchasers_dream_weather]]
modId="iris"
type="discouraged"
reason="Many shaders will extremely distort or break the weather effects of this mod."
versionRange="[1.0.0,)"
ordering="NONE"
side="CLIENT"

[[dependencies.stormchasers_dream_weather]]
modId="sable"
type="optional"
reason="Recommended for Rapier Physics Engine Support."
versionRange="2.0.6,)"
ordering="NONE"
side="BOTH"
